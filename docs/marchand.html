<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Le Comptoir du marchand</title>
<meta name="description" content="Tirez au hasard l'inventaire d'une boutique d'AD&D 2e à partir de la Grande Liste d'équipement du Net.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="bar top">
  <h1><span class="badge">MARCHAND</span> Le Comptoir du marchand</h1>
  <nav aria-label="Pages">
    <a href="./">Liste</a>
    <a href="marchand.html" aria-current="page">Marchand</a>
    <a href="api/v1/index.json">API</a>
  </nav>
</header>

<main>
  <div class="box">
    <div class="field">
      <label for="shop">Boutique :</label>
      <select id="shop"></select>
    </div>
    <p class="dim">Les joueurs poussent la porte ? Voici ce que le marchand a en stock aujourd'hui.</p>
  </div>
  <div class="box" id="out" aria-live="polite"><p>Chargement<span class="blink">_</span></p></div>
</main>

<nav class="bar bottom" aria-label="Commandes">
  <button type="button" id="go"><kbd>Espace</kbd> Nouveau stock</button>
  <button type="button" id="prev"><kbd>↑</kbd> Boutique précédente</button>
  <button type="button" id="next"><kbd>↓</kbd> Boutique suivante</button>
</nav>

<script>
(function(){
  const SHOPS=[
    ['taverne','La taverne',['taverne-et-auberge']],
    ['epicier',"L'épicier",['denrees-alimentaires','epices']],
    ['tailleur','Le tailleur',['vetements','tissus']],
    ['forgeron','Le forgeron armurier',['armes','armures']],
    ['bazar',"Le bazar de l'aventurier",['equipement-d-aventurier','eclairage','contenants']],
    ['quincaillier','Le quincaillier',['outils','equipements-divers']],
    ['herboriste',"L'herboriste",['herbes-et-poisons']],
    ['alchimiste',"L'alchimiste",['le-laboratoire']],
    ['scribe','Le papetier',['materiel-de-scribe']],
    ['sellier','Le sellier',['sellerie-et-harnachement','animaux']],
    ['fourreur','Le fourreur',['fourrures','peaux']],
    ['luthier','Le luthier',['coin-du-barde']],
    ['joaillier','Le négociant en matières précieuses',['materiaux-bruts']],
    ['exotique','Le marchand de curiosités',['oeufs-et-petits-de-creatures','parties-de-creatures']]
  ];
  const API='api/v1/categories/', cache={}, $=id=>document.getElementById(id);
  const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const sel=$('shop');
  SHOPS.forEach(([id,name])=>{const o=document.createElement('option');o.value=id;o.textContent=name;sel.appendChild(o);});
  try{const s=localStorage.getItem('shop'); if(s&&SHOPS.some(x=>x[0]===s)) sel.value=s;}catch(e){}
  const load=c=>cache[c]||(cache[c]=fetch(API+c+'.json').then(r=>r.json()).then(d=>d.items));
  const priceOf=it=>it.price||it.eggs||it.young||it.price_raw;
  let busy=false;
  async function enter(){
    if(busy) return; busy=true;
    const [id,name,cats]=SHOPS.find(s=>s[0]===sel.value);
    try{localStorage.setItem('shop',id);}catch(e){}
    try{
      const pool=(await Promise.all(cats.map(load))).flat().filter(it=>{const p=priceOf(it);return p&&p.min_cp!=null;});
      const picks=[...pool];
      for(let i=picks.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[picks[i],picks[j]]=[picks[j],picks[i]];}
      const stock=picks.slice(0,10).sort((a,b)=>a.full_name.fr.localeCompare(b.full_name.fr,'fr'));
      $('out').innerHTML=`<h2>${esc(name)}</h2><p class="rule" aria-hidden="true"></p>
<ul class="list" aria-label="Stock du jour">
<li class="dim" aria-hidden="true"><span class="name">Objet</span><span class="leader" style="visibility:hidden"></span><span>Prix</span></li>
${stock.map(it=>`<li><span class="name">${esc(it.full_name.fr)}</span><span class="leader" aria-hidden="true"></span><span class="price">${esc(priceOf(it).text.fr)}</span></li>`).join('')}
</ul><p class="rule" aria-hidden="true"></p><p class="dim">${pool.length} objets possibles chez ce marchand. Appuyez sur Espace pour un autre stock.</p>`;
    }catch(e){$('out').innerHTML='<p>Le marchand est absent : impossible de charger les données.</p>';}
    busy=false;
  }
  function step(d){sel.selectedIndex=(sel.selectedIndex+d+SHOPS.length)%SHOPS.length;enter();}
  sel.addEventListener('change',enter);
  $('go').addEventListener('click',enter);
  $('prev').addEventListener('click',()=>step(-1));
  $('next').addEventListener('click',()=>step(1));
  document.addEventListener('keydown',e=>{
    if(e.altKey||e.ctrlKey||e.metaKey) return;
    const inSelect=document.activeElement===sel;
    if(e.key===' '&&!inSelect&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();enter();}
    else if(e.key==='ArrowUp'&&!inSelect){e.preventDefault();step(-1);}
    else if(e.key==='ArrowDown'&&!inSelect){e.preventDefault();step(1);}
  });
  enter();
})();
</script>
</body>
</html>
